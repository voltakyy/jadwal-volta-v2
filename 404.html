<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman tidak ditemukan — Jadwal Volta</title>
<meta name="theme-color" content="#f6f0e4">
<style>
  :root{--paper:#f6f0e4;--card:#fffdf7;--ink:#24221f;--mustard:#f2b544;--tomato:#dd5a3a;--teal:#257a6b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:'Instrument Sans',ui-sans-serif,system-ui,'Segoe UI',sans-serif}
  .card{width:min(560px,100%);padding:40px 32px;background:var(--card);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);text-align:center}
  .stamp{display:inline-block;margin-bottom:20px;padding:6px 12px;border:2px solid var(--ink);background:var(--mustard);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  h1{font-size:clamp(56px,16vw,96px);line-height:1;letter-spacing:-.04em}
  p{margin:16px auto 28px;max-width:38ch;line-height:1.6}
  a{display:inline-block;padding:12px 20px;border:2px solid var(--ink);background:var(--teal);color:#fffdf7;font-weight:700;text-decoration:none;box-shadow:4px 4px 0 var(--ink)}
  a:hover{background:var(--tomato)}
  a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
  <main class="card">
    <span class="stamp">404 / salah ruang</span>
    <h1>404</h1>
    <p>Halaman yang kamu cari tidak ada di jadwal. Mungkin sudah pindah ruang, atau tautannya salah ketik.</p>
    <a href="./">Kembali ke jadwal</a>
  </main>
</body>
</html>
